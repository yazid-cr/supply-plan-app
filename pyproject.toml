[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-plan-app"
description = "Agent de planification de la chaine d'approvisionnement"
dynamic = ["version"]
readme = { text = "Agent de planification de la chaine d'approvisionnement.\n\nClasse une demande en OK (planifiable) ou RISQUE (rupture / retard).\n", content-type = "text/plain" }
requires-python = ">=3.11"
authors = [{ name = "A. Larhlimi" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30",
    "pydantic>=2,<3",
    "scikit-learn>=1.5,<1.6",
    "joblib>=1.4",
    "pandas>=2.0",
    "httpx>=0.27",
    "streamlit>=1.30",
]

[project.scripts]
supply = "supply_app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[tool.setuptools]
packages = ["supply_app", "api", "ui"]

[tool.setuptools.dynamic]
version = { attr = "supply_app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
